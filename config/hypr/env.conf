# ============================================================
# Hyprland 环境变量（被 hyprland.conf source）
# 仅影响 Hyprland 会话，不触碰 X11/i3 任何配置。
# ============================================================

# 会话标识
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland

# 输入法（fcitx5，Wayland 前端）
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,fcitx

# 桌面门户（截图 / 投屏）
# 门户由 XDG_CURRENT_DESKTOP=Hyprland + xdg-desktop-portal-hyprland 决定，无需额外变量。
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = CLUTTER_BACKEND,wayland

# PRIME offload（需要独显的 app 用 prime-run 调起；不全局强制）
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1
