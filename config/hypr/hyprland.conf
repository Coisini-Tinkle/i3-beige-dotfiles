# ============================================================
# Hyprland 主配置（最小可跑骨架）
# 显示器走 Intel 核显；MX350 仅 PRIME offload。不依赖 i3 任何文件。
# ============================================================

# 先载入环境变量（fcitx5 / portal / PRIME）
source = ~/.config/hypr/env.conf

# ---------- 显示器 ----------
# 自动多屏：每块屏用 preferred 分辨率、自动从左到右排布。
# 需要固定布局时改这里，或后续接 kanshi 做热插拔。
monitor = ,preferred,auto,1

# ---------- 外观 ----------
general {
  gaps_in = 10
  gaps_out = 4
  border_size = 3
  col.active_border = rgba(79a8a282)   # beige 青 #4f8a82
  col.inactive_border = rgba(22021120282)
  layout = dwindle
  cursor_inactive_timeout = 0
}

decoration {
  rounding = 0
  blur {
    enabled = false
  }
}

animations {
  enabled = false
}

# ---------- 输入 ----------
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    tap_to_click = true
  }
  numlock_by_default = true
}

# ---------- 杂项 ----------
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
}

# ---------- 自动平铺 ----------
exec-once = bash $HOME/.config/hypr/scripts/autotiling.sh

# ---------- 启动项（对标 i3 的 exec_always） ----------
exec-once = fcitx5 -d
exec-once = swww init || true
exec-once = bash $HOME/.config/hypr/scripts/set-wallpaper-hypr.sh
exec-once = waybar
exec-once = dex --autostart --environment Hyprland
exec-once = copyq --start-server || true
exec-once = dunst || true

# ---------- 键位（对齐 i3：Mod4 + hjkl） ----------
$mainMod = SUPER

# 启动器 / 终端
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, SPACE, exec, rofi -show drun
bind = ALT, SPACE, exec, rofi -show drun
bind = $mainMod, ESCAPE, exec, bash $HOME/.config/hypr/scripts/power.sh

# 锁屏
bind = $mainMod, L, exec, hyprlock

# 退出 / 重启
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod SHIFT, R, reload

# 方向聚焦 / 移动
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod, UP, movefocus, u
bind = $mainMod, RIGHT, movefocus, r
bind = $mainMod SHIFT, LEFT, movetoworkspace, l
bind = $mainMod SHIFT, DOWN, movetoworkspace, d
bind = $mainMod SHIFT, UP, movetoworkspace, u
bind = $mainMod SHIFT, RIGHT, movetoworkspace, r

# 分屏 / 全屏 / 浮动（对标 i3 习惯）
bind = $mainMod, F, fullscreen
bind = $mainMod, S, togglesplit
bind = $mainMod, V, togglefloating

# 工作区 1-10（数字行）
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# 截图（flameshot 已支持 Wayland）
bind = $mainMod, PRINT, exec, flameshot gui
bind = SHIFT, PRINT, exec, flameshot full

# 音量 / 亮度（与 i3 一致）
bind = , XF86AudioMute, exec, amixer sset Master toggle
bind = , XF86AudioLowerVolume, exec, amixer sset Master 5%-
bind = , XF86AudioRaiseVolume, exec, amixer sset Master 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# ---------- 窗口规则（对标 i3 的 for_window） ----------
windowrulev2 = float, class:(copyq)
windowrulev2 = float, class:(kitty-float)
windowrulev2 = float, class:(kitty-dropdown)
windowrulev2 = float, class:(notification-drop-panel)
windowrulev2 = float, class:(ToDesk)
windowrulev2 = pin, class:(ToDesk)
windowrulev2 = float, title:(ToDesk)
windowrulev2 = workspace 1, class:(firefox)
windowrulev2 = workspace 2, class:(kitty)
