# ============================================================
# hyprlock 锁屏配置（复用 beige 壁纸，配色对齐）
# 背景只读引用 i3 的 beige 壁纸，不改 i3 文件。
# ============================================================

background {
  path = ~/.config/i3/themes/current/wallpaper.png
  blur_passes = 0
  color = rgba(229 225 200 1.0)   # beige #e5e1c8
}

# 时间
label {
  monitor = 
  text = cmd[date +"%H:%M"]
  color = rgba(32 32 29 1.0)      # #20201d
  font_size = 64
  position = 0, -40
  halign = center
  valign = center
}

# 日期
label {
  monitor = 
  text = cmd[date +"%d-%m-%Y"]
  color = rgba(111 106 92 1.0)    # #6f6a5c
  font_size = 24
  position = 0, 30
  halign = center
  valign = center
}

# 密码输入框
input-field {
  monitor = 
  size = 280, 50
  outline_thickness = 2
  outline_color = rgba(109 141 135 1.0)   # #6d8d87 青
  color = rgba(32 32 29 1.0)
  background_color = rgba(245 235 225 0.9)
  font_color = rgba(32 32 29 1.0)
  position = 0, 100
  halign = center
  valign = center
  inner_color = rgba(109 141 135 1.0)
  fade_on_empty = false
  placeholder_text = <hidden>
}
