# Minimal hacker-style kitty setup:
# - Font: JetBrainsMono Nerd Font Mono
# - Palette: dark graphite with cyan/green accents
# - Motion: smooth beam cursor with trail

# Font
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5

# Cursor and motion
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0
cursor #7af7d0
cursor_text_color #0b1118
cursor_trail 90
cursor_trail_decay 0.08 0.28
cursor_trail_start_threshold 2
cursor_trail_color #64d2ff

repaint_delay 10
input_delay 3
sync_to_monitor yes

# Window atmosphere
allow_remote_control yes
background_opacity 0.92
background_blur 16
background_image ~/.config/kitty/current-bg
background_image_layout cscaled
background_image_linear yes
background_tint 0.93
background_tint_gaps 0.98
window_padding_width 12
window_margin_width 8
single_window_margin_width 8
window_border_width 1.5pt
draw_minimal_borders yes
active_border_color #64d2ff
inactive_border_color #273241
inactive_text_alpha 0.84

# Layout and splits
enabled_layouts splits
map ctrl+shift+h combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+j combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window bottom
map ctrl+alt+k neighboring_window top
map ctrl+alt+l neighboring_window right
map ctrl+shift+left resize_window narrower 3
map ctrl+shift+right resize_window wider 3
map ctrl+shift+up resize_window taller 3
map ctrl+shift+down resize_window shorter 3
map ctrl+shift+w close_window

# Tabs
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_margin_width 6
tab_bar_margin_height 6 0
tab_title_template "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
active_tab_foreground   #091017
active_tab_background   #64d2ff
inactive_tab_foreground #8ba0b3
inactive_tab_background #131b24
tab_bar_background      #0b1118

# Scrolling
pixel_scroll yes
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0
momentum_scroll 0.95

# Less noise
enable_audio_bell no
confirm_os_window_close 0
url_style curly

# Graphite cyan
foreground              #d6deeb
background              #0b1118
selection_foreground    #0b1118
selection_background    #64d2ff
url_color               #7af7d0
mark1_foreground        #0b1118
mark1_background        #64d2ff
mark2_foreground        #0b1118
mark2_background        #7af7d0
mark3_foreground        #0b1118
mark3_background        #ffd166

color0  #10161d
color1  #ff6b6b
color2  #7af7d0
color3  #ffd166
color4  #64d2ff
color5  #b794f4
color6  #7dd3fc
color7  #c8d6e5
color8  #273241
color9  #ff8b8b
color10 #98ffe0
color11 #ffe08a
color12 #8adfff
color13 #ccb4ff
color14 #9fe4ff
color15 #e6edf3

include ~/.config/i3/themes/beige/kitty-beige.conf
