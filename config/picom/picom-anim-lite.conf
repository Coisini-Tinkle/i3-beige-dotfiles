# Picom — battery / lightweight + animations disabled
# Uses picom-ft-labs

backend = "glx";
vsync = true;
use-damage = true;

# === Animations OFF (battery saving) ===
animations = false;

# === Shadow ===
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = '^Rofi$'",
  "class_g = '^Conky$'",
  "name = 'cpt_frame_xcb_window'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# === Fading ===
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.045;
fade-delta = 8;
no-fading-openclose = false;
no-fading-destroyed-argb = false;

# === NO BLUR (battery saving) ===

# === Opacity ===
inactive-opacity = 0.5;
active-opacity = 1.0;
frame-opacity = 0.90;
inactive-opacity-override = false;

# === Corner Radius ===
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = '^Dunst$'",
  "class_g = '^notification-drop-panel$'"
];

# === Detection ===
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;

# === Window Rules ===
rules: (
  { match = "class_g = '^Rofi$'"; shadow = false; corner-radius = 12; },
  { match = "class_g = '^Dunst$'"; shadow = false; corner-radius = 0; },
  { match = "class_g = '^notification-drop-panel$'"; shadow = false; corner-radius = 0; },
  { match = "class_g = '^copyq$'"; shadow = false; },
  { match = "fullscreen = true"; shadow = false; corner-radius = 0; opacity = 1.0; }
)

# === Window Type Rules ===
wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
  notification = { fade = false; shadow = false; corner-radius = 0; };
};
