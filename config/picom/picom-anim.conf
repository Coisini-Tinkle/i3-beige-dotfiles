# Picom — AC power / full effects + animations
# Uses picom-ft-labs (animation fork)

backend = "glx";
vsync = true;
use-damage = true;

# === Animations (picom-ft-labs) ===
animations = true;
animation-stiffness-in-tag = 150.0;
animation-stiffness-tag-change = 100.0;
animation-window-mass = 0.6;
animation-dampening = 18;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "slide-up";

animation-for-prev-tag = "minimize";
enable-fading-prev-tag = true;
animation-for-next-tag = "slide-in-center";
enable-fading-next-tag = true;

# === Shadow ===
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = '^Rofi$'",
  "class_g = '^Conky$'",
  "name = 'cpt_frame_xcb_window'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# === Fading ===
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.045;
fade-delta = 8;
no-fading-openclose = false;
no-fading-destroyed-argb = false;

# === Blur (dual-kawase) ===
blur-method = "dual_kawase";
blur-strength = 12;
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = '^Dunst$'",
  "name = 'cpt_frame_xcb_window'"
];

# === Opacity ===
inactive-opacity = 0.5;
active-opacity = 1.0;
frame-opacity = 0.90;
inactive-opacity-override = false;

# === Corner Radius ===
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = '^Dunst$'",
  "class_g = '^notification-drop-panel$'"
];

# === Detection ===
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;

# === Window Rules ===
rules: (
  { match = "class_g = '^Rofi$'"; shadow = false; corner-radius = 12; },
  { match = "class_g = '^Dunst$'"; shadow = false; blur-background = false; corner-radius = 0; },
  { match = "class_g = '^notification-drop-panel$'"; shadow = false; blur-background = false; corner-radius = 0; },
  { match = "class_g = '^copyq$'"; shadow = false; },
  { match = "fullscreen = true"; shadow = false; blur-background = false; corner-radius = 0; opacity = 1.0; }
)

# === Window Type Rules ===
wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock = { shadow = false; blur-background = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = false; };
  dropdown_menu = { opacity = 1.0; shadow = false; };
  notification = { fade = false; shadow = false; blur-background = false; corner-radius = 0; };
};
