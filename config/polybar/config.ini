[colors]
background = #e5e1c8
background-alt = #cfcab0
foreground = #20201d
foreground-dim = #6f6a5c
ink = #20201d
cream = #f4f0db
cyan = #6d8d87
aqua = #7f9a8a
green = #7c886d
yellow = #b99a57
orange = #bf815a
red = #b86a76
purple = #8f7bb0
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 34
offset-x = 0
offset-y = 8
radius = 0
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font Mono:size=11;2
font-1 = JetBrainsMono Nerd Font Mono:size=14;3
font-2 = Noto Sans CJK SC:size=11;2
font-3 = JetBrainsMono Nerd Font:size=22;7
font-4 = JetBrainsMono Nerd Font Mono:size=9;2
font-5 = JetBrainsMono Nerd Font:size=17;5
modules-left = menu workspaces
modules-center = date
modules-right = battery power-profile wlan vm-status tray
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[bar/secondary]
inherit = bar/main
monitor = ${env:MONITOR:}
modules-right = battery power-profile wlan

[module/menu]
type = custom/text
content = %{T4}%{F#20201d}%{F-}%{T-}%{T1}%{B#20201d}%{F#f4f0db} 󰣛 %{F-}%{B-}%{T-}%{T4}%{F#20201d}%{F-}%{T-}
click-left = rofi -show drun

[module/control-center]
type = custom/script
exec = ~/.config/polybar/scripts/control-center-icon.sh
tail = true
click-left = bash ~/.config/i3/rofi/control-center.sh

[module/workspaces]
; dot indicator: focused=capsule, occupied=●, empty=–  (per-monitor via $MONITOR + routing)
type = custom/script
exec = ~/.config/polybar/scripts/i3-workspaces.sh
tail = true

; legacy labelled-pill workspace module, kept for rollback (not in modules-left)
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
strip-wsnumbers = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
show-urgent = true
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.cream}
label-focused = %name%
label-focused-background = ${colors.ink}
label-focused-foreground = ${colors.cream}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground-dim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-foreground = ${colors.ink}
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.cream}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 30
date = %d-%m-%Y
time = %H:%M
label = %{A1:bash ~/.config/i3/panels/control-center-toggle.sh:}%{A3:bash ~/.config/i3/panels/music-panel-toggle.sh:}  %time%   %date%%{A}%{A}
format = <label>
format-prefix = 
format-prefix-font = 4
format-prefix-foreground = ${colors.ink}
format-suffix = 
format-suffix-font = 4
format-suffix-foreground = ${colors.ink}
label-background = ${colors.ink}
label-foreground = ${colors.cream}

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 60
format-connected = <label-connected>
format-connected-prefix = 
format-connected-prefix-font = 4
format-connected-prefix-foreground = ${colors.ink}
format-connected-suffix = 
format-connected-suffix-font = 4
format-connected-suffix-foreground = ${colors.ink}
format-disconnected = <label-disconnected>
format-disconnected-prefix = 
format-disconnected-prefix-font = 4
format-disconnected-prefix-foreground = ${colors.ink}
format-disconnected-suffix = 
format-disconnected-suffix-font = 4
format-disconnected-suffix-foreground = ${colors.ink}
label-connected =  󰤨 %essid%
label-connected-background = ${colors.ink}
label-connected-foreground = ${colors.cream}
label-disconnected =  󰤭 off
label-disconnected-background = ${colors.ink}
label-disconnected-foreground = ${colors.foreground-dim}
click-left = sh -c 'bash /home/coisini/.config/i3/rofi/wifi.sh'
click-right = sh -lc 'kitty --class kitty-float -e nmtui >/tmp/polybar-nmtui.log 2>&1 &'

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
poll-interval = 60
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-full-prefix = 󰁹
format-charging-foreground = ${colors.ink}
format-discharging-foreground = ${colors.ink}
format-full-foreground = ${colors.ink}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-framerate = 750

[module/power-profile]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/power-profile.sh
hook-1 = ~/.config/polybar/scripts/power-profile.sh --toggle
initial = 1
format-foreground = ${colors.ink}
click-left = polybar-msg action "#power-profile.hook.1"

[module/vm-status]
type = custom/script
exec = ~/.config/polybar/scripts/vm-status.sh
tail = true
font = 6
click-left = sh -c 'state=$(virsh --connect qemu:///system domstate win11 2>/dev/null); if [ "$state" = "running" ]; then virt-viewer --connect qemu:///system win11; else virsh --connect qemu:///system start win11; fi'
click-right = bash ~/.config/polybar/scripts/vm-menu.sh

[module/tray]
type = internal/tray
tray-background = ${colors.background}
tray-spacing = 4px

[settings]
screenchange-reload = false
pseudo-transparency = false
